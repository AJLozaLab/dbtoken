[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbtoken"
dynamic = ["version"]
description = "A tokenizer for long-format database and EHR tabular data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andrew Loza" },
    { name = "Tom Shin" },
]
keywords = [
    "tokenizer",
    "ehr",
    "healthcare",
    "tabular-data",
    "bpe",
    "clinical-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "polars",
    "scipy",
]

[project.optional-dependencies]
bpe = [
    "rustbpe",
    "tiktoken",
]
metrics = ["torch"]
dev = [
    "pytest>=8.0",
    "rustbpe",
    "tiktoken",
    "torch",
]

[project.urls]
Homepage = "https://github.com/AJLozaLab/dbtoken"
Repository = "https://github.com/AJLozaLab/dbtoken"
Issues = "https://github.com/AJLozaLab/dbtoken/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["dbtoken*"]

[tool.setuptools.dynamic]
version = { attr = "dbtoken.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = "test_*.py"
